name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Set minimal permissions for security
permissions:
  contents: read

# Prevent multiple simultaneous deployments
concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Verify pnpm installation
        run: |
          pnpm --version
          which pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        continue-on-error: false

      - name: Validate SSH key format
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Error: SSH_PRIVATE_KEY secret is empty or not set"
            exit 1
          fi
          # Check if key starts with BEGIN marker
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | head -1 | grep -q "BEGIN.*PRIVATE KEY" || {
            echo "Error: SSH key does not start with BEGIN marker. Make sure you're using the PRIVATE key, not the public key."
            exit 1
          }
          echo "SSH key format appears valid"

      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify SSH key is loaded
        run: |
          ssh-add -l || {
            echo "Error: Failed to load SSH key into agent"
            echo "Troubleshooting:"
            echo "1. Verify SSH_PRIVATE_KEY secret contains the full private key (including BEGIN/END lines)"
            echo "2. Ensure the key has no passphrase"
            echo "3. Check that you copied the PRIVATE key (not the .pub file)"
            exit 1
          }
          echo "SSH key successfully loaded"

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via rsync (using SSH agent)
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            build/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_REMOTE_PATH }}/

      - name: Health check
        run: |
          echo "Deployment completed. Please verify the site is accessible."
          echo "If health check fails, manual rollback may be required."

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed - manual intervention may be required"
            echo "Please check the logs above for details."
          fi
