name: Deploy

# Rewritten 2026-08-16 for adapter-node, replacing a workflow that had been disarmed because it
# would have destroyed the live site. What it used to do, and what changed:
#
#   * It ran only `pnpm build`, so a red type gate still deployed.
#     -> `pnpm check` and `pnpm test` now gate the build, and the job stops if either fails.
#
#   * It rsynced `build/` over $SSH_REMOTE_PATH (the static docroot, /var/www/wcfp/html) with
#     `--delete`. Under adapter-node `build/` holds a Node server — index.js, handler.js — not a
#     site, so that replaced the served files with something no static server can serve.
#     -> It now ships to SSH_APP_PATH, an application directory, and never touches the docroot.
#
#   * `--delete` would also have removed anything already living there, including the 180 MB
#     DuckDB the app reads.
#     -> `data/` and `node_modules/` are excluded, so a deploy cannot delete the database.
#
#   * "Verify deployment" piped `find` into `head`, so the step's exit status was head's — it
#     reported success over a destroyed site.
#     -> Verification is a real HTTP check that fails the job on a bad status.
#
#   * adapter-node needs its process restarted to pick up a new build; nothing restarted it.
#     -> The service is restarted, then health-checked.
#
# STILL MANUAL, DELIBERATELY. The `push` trigger stays off until this has been proven against a
# staging target. Arming it is a separate decision, not a side effect of this rewrite.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you intend to update the live site'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Confirm intent
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "::error::Refusing to deploy: type 'deploy' in the confirm input to proceed."
            exit 1
          fi

      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_APP_PATH: ${{ secrets.SSH_APP_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_USERNAME SSH_APP_PATH SSH_PRIVATE_KEY HEALTHCHECK_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          # SSH_APP_PATH must not be the static docroot the old workflow overwrote.
          case "${SSH_APP_PATH:-}" in
            */html|*/html/) echo "::error::SSH_APP_PATH looks like the web docroot. Deploy the Node app elsewhere."; missing=1 ;;
          esac
          [ "$missing" -eq 0 ]

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gates the old workflow skipped. A deploy that ships a red build is worse than no
      # deploy, because it looks like it worked.
      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify build is an adapter-node server
        run: |
          set -euo pipefail
          test -f build/index.js || { echo "::error::build/index.js missing — is the adapter still adapter-node?"; exit 1; }
          echo "Build looks correct:"
          ls -la build/

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key | grep -q "BEGIN.*PRIVATE KEY" \
            || { echo "::error::SSH key is not a private key in PEM form"; exit 1; }
          ssh-keyscan -H -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ship the server bundle
        run: |
          set -euo pipefail
          # --delete keeps the app directory honest, but data/ holds the DuckDB the app reads and
          # node_modules/ is installed server-side; neither is ours to remove.
          rsync -az --delete --human-readable \
            --exclude 'data/' \
            --exclude 'node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }}" \
            build/ package.json pnpm-lock.yaml \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_APP_PATH }}/"

      - name: Install production dependencies and restart
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "set -euo pipefail
             cd '${{ secrets.SSH_APP_PATH }}'
             corepack enable
             pnpm install --prod --frozen-lockfile
             sudo systemctl restart '${{ secrets.SERVICE_NAME || 'wcfp' }}'
             sudo systemctl is-active --quiet '${{ secrets.SERVICE_NAME || 'wcfp' }}'"

      - name: Health check
        run: |
          set -euo pipefail
          url="${{ secrets.HEALTHCHECK_URL }}"
          # Give the service a moment to bind, then require a 200. Unlike the old `find | head`,
          # a failure here fails the job.
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
            echo "Attempt $attempt: HTTP $status"
            [ "$status" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::Health check never returned 200 for $url — the site may be down."
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
