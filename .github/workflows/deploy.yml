name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Set minimal permissions for security
permissions:
  contents: read

# Prevent multiple simultaneous deployments
concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Verify pnpm installation
        run: |
          pnpm --version
          which pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        continue-on-error: false

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write private key to file
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Verify key format
          if ! head -1 ~/.ssh/deploy_key | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "Error: SSH key does not start with BEGIN marker"
            echo "First line: $(head -1 ~/.ssh/deploy_key)"
            exit 1
          fi
          echo "SSH key file created successfully"

      - name: Verify build output
        run: |
          echo "Build directory contents:"
          ls -la build/ || echo "Build directory not found!"
          echo ""
          echo "Looking for index.html:"
          find build -name "index.html" -o -name "*.html" | head -10

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH connection successful' && pwd && ls -la ${{ secrets.SSH_REMOTE_PATH }} || echo 'Remote path does not exist'"

      - name: Deploy via rsync (using SSH key file)
        run: |
          echo "Deploying from build/ to ${{ secrets.SSH_REMOTE_PATH }}"
          rsync -avz --delete --verbose \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} -o StrictHostKeyChecking=no" \
            build/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_REMOTE_PATH }}/
          echo "Deployment completed"

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

      - name: Health check
        run: |
          echo "Deployment completed. Please verify the site is accessible."
          echo "If health check fails, manual rollback may be required."

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed - manual intervention may be required"
            echo "Please check the logs above for details."
          fi
