name: Deploy

# Deploys to wcfp.hpc4ai.unito.it through a self-hosted runner on the host itself.
#
# The previous version pushed over SSH from a GitHub runner, which needed six secrets, a pinned
# host key and a private key in the repository settings. The sibling project on the same machine
# (healthysustainablecities/ghsci) instead runs a self-hosted runner as a scoped user, and that is
# a smaller thing to get right: the runner is already inside the network, already authenticated,
# and there is no key material to hold.
#
# Layout on the host, established by earlier deploys:
#
#   /srv/wcfp/releases/<sha>/  one directory per release, holding the adapter-node output
#   /srv/wcfp/shared/          DuckDB files; wcfp.duckdb is a symlink to the live one
#   /srv/wcfp/current          -> the live release
#
# nginx proxies the site to 127.0.0.1:3101, served by wcfp-next.service, whose unit points at
# /srv/wcfp/current.
#
# THE DATABASE IS NOT DEPLOYED HERE. It is 172 MB and not in git, and the source files on the host
# are the pre-correction ones, so the runner cannot rebuild it either. It is uploaded out of band
# by scripts/deploy-ssh.sh. What this workflow does instead is refuse to activate a release whose
# code needs a column the live database lacks — the failure mode that would otherwise surface as a
# 500 on a page nobody checked.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP: /srv/wcfp
  SERVICE: wcfp-next
  HEALTH: https://wcfp.hpc4ai.unito.it/about
  PROBE: https://wcfp.hpc4ai.unito.it/species/14370

jobs:
  deploy:
    runs-on: [self-hosted, wcfp]
    timeout-minutes: 20

    steps:
      # persist-credentials: false because this runner's workspace is not ephemeral. The default
      # writes the job token into .git/config, where it would sit on disk between runs.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      # No `version:` input — package.json pins packageManager, and setting both makes
      # pnpm/action-setup fail with "Multiple versions of pnpm specified". Same as ci.yml.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A red type gate must not reach production. The database-backed specs are skipped here:
      # they read data/wcfp.duckdb, which lives on the host rather than in the checkout.
      - name: Gate
        run: |
          pnpm check
          pnpm vitest run --project server --exclude '**/*.data.spec.ts'

      - name: Build
        run: pnpm build

      # readlink -e, not -f: -f canonicalises a path whose last component does not exist and still
      # succeeds, so a missing `current` would be recorded as a rollback target that cannot work.
      - name: Record what is live
        id: prev
        run: |
          echo "release=$(readlink -e "$APP/current" || echo none)" >> "$GITHUB_OUTPUT"

      # The one check that catches a code/database mismatch before it reaches a reader. Add a
      # column here when a query starts depending on it.
      - name: Verify the live database has the columns this release queries
        run: |
          set -euo pipefail
          DB=$(readlink -e "$APP/shared/wcfp.duckdb") || { echo "::error::$APP/shared/wcfp.duckdb does not resolve to a file."; exit 1; }
          echo "Checking $DB"
          for col in cultivated cwr use_human_food source_link; do
            duckdb -readonly "$DB" \
              "SELECT ${col} FROM species LIMIT 1" >/dev/null 2>&1 \
              || { echo "::error::species.${col} is missing from the deployed database. Upload a rebuilt database (scripts/deploy-ssh.sh) before this release can go live."; exit 1; }
          done
          for col in flora_richness pct_of_flora; do
            duckdb -readonly "$DB" "SELECT ${col} FROM regions LIMIT 1" >/dev/null 2>&1 \
              || { echo "::error::regions.${col} is missing from the deployed database."; exit 1; }
          done
          echo "Schema satisfies this release."

      # Staged beside the target and renamed into place, never written over it. A workflow_dispatch
      # re-run produces the same SHA and so the same release path — clearing that path first would
      # delete the directory the running service is executing from.
      - name: Stage the release
        id: stage
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          RELEASE="$APP/releases/$SHA"
          STAGING="$APP/releases/.staging-$SHA-$GITHUB_RUN_ID"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R build/. "$STAGING/"
          cp package.json pnpm-lock.yaml "$STAGING/"
          ( cd "$STAGING" && pnpm install --prod --frozen-lockfile )

          # If this SHA is already live, keep its directory and publish under a run-suffixed name;
          # the old directory is pruned later, once nothing points at it.
          if [ "$(readlink -e "$APP/current" || true)" = "$RELEASE" ]; then
            RELEASE="$RELEASE-$GITHUB_RUN_ID"
          else
            rm -rf "$RELEASE"
          fi
          mv -T "$STAGING" "$RELEASE"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      # A rename, so the service never observes a missing or half-written `current`.
      - name: Activate
        run: |
          set -euo pipefail
          ln -sfn "${{ steps.stage.outputs.release }}" "$APP/current.new"
          mv -T "$APP/current.new" "$APP/current"
          sudo /usr/bin/systemctl restart "$SERVICE"

      - name: Health check
        id: health
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            a=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$HEALTH" || echo 000)
            b=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$PROBE" || echo 000)
            echo "attempt $attempt: about=$a species=$b"
            if [ "$a" = "200" ] && [ "$b" = "200" ]; then ok=1; break; fi
          done
          [ "$ok" = "1" ] || { echo "::error::Health check failed."; exit 1; }

      - name: Roll back
        if: failure() && steps.stage.outcome == 'success' && steps.prev.outputs.release != 'none'
        run: |
          set -euo pipefail
          echo "Restoring ${{ steps.prev.outputs.release }}"
          ln -sfn "${{ steps.prev.outputs.release }}" "$APP/current.new"
          mv -T "$APP/current.new" "$APP/current"
          sudo /usr/bin/systemctl restart "$SERVICE"
          sleep 5
          echo "after rollback: $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$HEALTH")"

      # The live release is excluded from the candidate list regardless of age, and the pipeline is
      # guarded: with fewer than six releases grep matches nothing, exits 1, and pipefail would
      # otherwise fail the job after a successful deploy.
      - name: Prune old releases
        if: success()
        run: |
          set -euo pipefail
          LIVE=$(basename "$(readlink -e "$APP/current")")
          { ls -1t "$APP/releases" | tail -n +6 | grep -v "^${LIVE}$" || true; } \
            | sed "s|^|$APP/releases/|" | xargs -r rm -rf
          ls -1t "$APP/releases"
