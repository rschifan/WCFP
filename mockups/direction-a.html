<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Direction A — Quiet data portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}</style>
</head>
<body class="bg-slate-100">
<div class="flex min-h-screen w-screen flex-col">
	<!-- Top bar -->
	<header class="flex h-14 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-6">
		<div class="flex items-center gap-2">
			<div class="h-7 w-7 rounded bg-slate-900"></div>
			<span class="text-sm font-semibold text-slate-900">WCFP Explorer</span>
		</div>
		<nav class="flex items-center gap-5 text-sm text-slate-600">
			<span class="text-slate-900">Map</span>
			<span>Taxonomy</span>
			<span>About</span>
		</nav>
	</header>

	<!-- NEW: page context strip -->
	<section class="shrink-0 border-b border-slate-200 bg-white px-6 py-4">
		<div class="flex flex-wrap items-end justify-between gap-4">
			<div>
				<h1 class="text-xl font-semibold text-slate-900">Food plants worldwide</h1>
				<p class="mt-0.5 text-sm text-slate-500">Distribution of 26,632 edible plant species across 369 botanical regions.</p>
			</div>
			<div class="relative w-80">
				<svg class="absolute top-1/2 left-3 h-4 w-4 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
				<input type="text" placeholder="Search region or country…" class="w-full rounded-md border border-slate-200 bg-white py-2 pr-3 pl-10 text-sm text-slate-900 shadow-sm outline-none placeholder:text-slate-400 focus:border-slate-400" />
			</div>
		</div>
	</section>

	<!-- Map area -->
	<main class="relative flex-1 overflow-hidden bg-white">
		<div class="absolute inset-0 text-rose-500/70">
			<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" class="h-full w-full">
				<g fill="currentColor" stroke="#94a3b8" stroke-width="0.6" stroke-linejoin="round">
					<path d="M100 80 L180 70 L240 85 L290 120 L310 180 L280 230 L240 260 L200 270 L150 260 L120 220 L90 160 Z" fill-opacity="0.18" />
					<path d="M245 290 L285 305 L295 345 L275 400 L235 440 L215 410 L210 360 L225 320 Z" fill-opacity="0.32" />
					<path d="M430 90 L490 85 L540 95 L575 105 L585 150 L555 180 L500 175 L450 160 L425 130 Z" fill-opacity="0.22" />
					<path d="M440 190 L510 195 L540 240 L520 320 L470 370 L445 335 L440 260 Z" fill-opacity="0.14" />
					<path d="M600 80 L730 75 L860 95 L880 160 L830 210 L780 210 L720 180 L640 150 Z" fill-opacity="0.15" />
					<path d="M720 195 L790 200 L810 245 L820 295 L775 310 L730 290 L705 245 Z" fill-opacity="0.48" />
					<path d="M810 300 L855 305 L880 340 L870 385 L820 395 L795 355 Z" fill-opacity="0.28" />
					<path d="M840 390 L900 385 L920 425 L880 455 L835 440 Z" fill-opacity="0.32" />
				</g>
			</svg>
		</div>

		<!-- Legend moved to bottom-left as a tidy card -->
		<div class="absolute bottom-4 left-4 rounded-lg border border-slate-200 bg-white/95 p-3 shadow-sm backdrop-blur">
			<div class="flex items-center gap-2 text-[10px] font-semibold tracking-[0.16em] text-slate-500 uppercase">
				<span>Food plant species</span>
			</div>
			<div class="mt-2 h-1.5 w-40 rounded-full bg-gradient-to-r from-rose-50 via-rose-300 to-rose-600"></div>
			<div class="mt-1.5 flex justify-between text-[11px] text-slate-500">
				<span>1</span><span>1,797</span><span>3,592</span>
			</div>
			<p class="mt-2 text-[11px] text-slate-500">Click a region to explore</p>
		</div>
	</main>

	<!-- Partners footer -->
	<footer class="shrink-0 border-t border-slate-200 bg-slate-50 px-6 py-5">
		<div class="flex flex-wrap items-center gap-6">
			<span class="text-[10px] font-semibold tracking-[0.18em] text-slate-500 uppercase">Partners</span>
			<div class="flex flex-wrap items-center gap-x-10 gap-y-3 opacity-70">
				<span class="text-xs font-semibold text-slate-700">NYBG</span>
				<span class="text-xs font-semibold text-slate-700">Botaniska</span>
				<span class="text-xs font-semibold text-slate-700">Royal Botanic Gardens, Kew</span>
				<span class="text-xs font-semibold text-slate-700">Università di Torino</span>
				<span class="text-xs font-semibold text-slate-700">Crop Trust</span>
			</div>
		</div>
	</footer>
</div>
</body>
</html>
